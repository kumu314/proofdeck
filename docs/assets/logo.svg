<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ProofDeck logo: a deck card stamped with a proof seal, chained. -->
  <defs>
    <linearGradient id="cardbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2b2e"/>
      <stop offset="1" stop-color="#172224"/>
    </linearGradient>
  </defs>

  <!-- hash-chain dots leading into the card -->
  <g fill="#a6d0b9" opacity="0.55">
    <circle cx="70" cy="430" r="10"/>
    <circle cx="108" cy="456" r="7"/>
    <circle cx="142" cy="474" r="4.5"/>
  </g>

  <!-- the deck card, slightly stamped over -->
  <g transform="rotate(-8 256 256)">
    <rect x="96" y="96" width="320" height="320" rx="48" fill="url(#cardbg)" stroke="#e9c779" stroke-width="10"/>
    <!-- proof seal: ring + check -->
    <circle cx="256" cy="240" r="92" fill="none" stroke="#e9c779" stroke-width="12"/>
    <circle cx="256" cy="240" r="74" fill="none" stroke="#a6d0b9" stroke-width="4" opacity="0.5"/>
    <path d="M 214 244 L 246 276 L 306 204" fill="none" stroke="#a6d0b9" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- card footer rule: the "evidence line" -->
    <line x1="170" y1="368" x2="342" y2="368" stroke="#e9c779" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
    <line x1="196" y1="388" x2="316" y2="388" stroke="#e9c779" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- stamp notch: the deck was here -->
  <circle cx="418" cy="118" r="9" fill="#e9c779" opacity="0.9"/>
</svg>
