name: Feature request
description: Suggest an idea or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is hard or unreliable today? Concrete scenario beats abstract feature.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What you'd expect ProofDeck to do — with acceptance-style criteria if possible.
    validations:
      required: true
  - type: checkboxes
    id: alignment
    attributes:
      label: Alignment
      options:
        - label: This fits the verification-first contract (evidence over vibes)
          required: true
